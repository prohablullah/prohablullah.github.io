<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সাইন আপ | Hablullah HSC 2028</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-wrap"><section class="auth-card"><a class="back" href="index.html">← হোমপেজে ফিরে যাও</a><a class="brand" href="index.html"><span class="mark">HE</span><span>Hablullah El Masry<small>HSC 2028</small></span></a><h1>নতুন অ্যাকাউন্ট</h1><p>শিক্ষার্থী হিসেবে নিবন্ধন করো।</p><form id="signupForm"><label class="field" for="name">পূর্ণ নাম</label><input class="input" id="name" required maxlength="80" autocomplete="name" placeholder="তোমার নাম"><label class="field" for="email">ইমেইল</label><input class="input" id="email" type="email" required autocomplete="email" placeholder="তোমার ইমেইল"><label class="field" for="password">পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input class="input" id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="একটি শক্তিশালী পাসওয়ার্ড"><button class="btn full" type="submit">অ্যাকাউন্ট তৈরি করো</button><p id="status" class="status" aria-live="polite"></p></form><p>আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html" style="color:var(--green)">লগইন</a></p><div class="notice">সাইন আপ থেকে কেউ নিজে নিজে এডমিন হতে পারবে না।</div></section></main><script type="module" src="auth.js"></script></body></html>
